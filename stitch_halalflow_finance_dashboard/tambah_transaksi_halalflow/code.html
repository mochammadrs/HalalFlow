<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HalalFlow - Tambah Transaksi Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "on-surface": "#191c1d",
                        "tertiary-container": "#526074",
                        "surface-container": "#edeeef",
                        "tertiary-fixed": "#d5e3fc",
                        "surface-variant": "#e1e3e4",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#0d1c2e",
                        "on-secondary-fixed": "#251a00",
                        "on-secondary-fixed-variant": "#5a4400",
                        "on-tertiary-container": "#ccdbf3",
                        "primary-fixed-dim": "#95d4b3",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#ffd87c",
                        "secondary-fixed": "#ffdf96",
                        "surface-container-low": "#f3f4f5",
                        "tertiary-fixed-dim": "#b9c7df",
                        "outline-variant": "#bfc9c1",
                        "on-error": "#ffffff",
                        "surface-bright": "#f8f9fa",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#f0f1f2",
                        "primary": "#0f5238",
                        "primary-container": "#2d6a4f",
                        "surface-tint": "#2c694e",
                        "outline": "#707973",
                        "secondary-fixed-dim": "#e7c268",
                        "on-tertiary-fixed-variant": "#3a485b",
                        "background": "#f8f9fa",
                        "on-primary-fixed-variant": "#0e5138",
                        "inverse-surface": "#2e3132",
                        "error-container": "#ffdad6",
                        "on-background": "#191c1d",
                        "primary-fixed": "#b1f0ce",
                        "surface-container-highest": "#e1e3e4",
                        "on-primary-fixed": "#002114",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#95d4b3",
                        "on-secondary-container": "#795d08",
                        "surface": "#f8f9fa",
                        "on-surface-variant": "#404943",
                        "surface-container-high": "#e7e8e9",
                        "on-primary-container": "#a8e7c5",
                        "secondary": "#765a05",
                        "surface-dim": "#d9dadb",
                        "tertiary": "#3a485c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "margin-desktop": "40px",
                        "base": "4px",
                        "lg": "24px",
                        "gutter": "20px",
                        "xl": "32px",
                        "sm": "12px",
                        "xs": "8px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "numeric-data": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"],
                        "display": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "numeric-data": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased relative min-h-screen">
<!-- Background Screen Simulation (using provided screen data placeholder) -->
<div class="absolute inset-0 z-0">
<iframe class="w-full h-full border-none pointer-events-none" src="{{DATA:SCREEN:SCREEN_4}}" title="Background Screen"></iframe>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-on-surface/20 backdrop-blur-sm">
<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-2xl rounded-2xl shadow-xl border border-surface-variant overflow-hidden flex flex-col max-h-[921px]">
<!-- Modal Header -->
<div class="flex items-center justify-between px-lg py-md border-b border-surface-variant bg-surface-bright sticky top-0 z-10">
<h2 class="font-headline-md text-headline-md text-on-surface">Catat Transaksi</h2>
<button aria-label="Close modal" class="p-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body (Scrollable) -->
<div class="p-lg overflow-y-auto custom-scrollbar">
<!-- Segmented Control (Toggle) -->
<div class="flex p-1 bg-surface-container-low rounded-lg mb-8">
<button aria-pressed="true" class="flex-1 py-2 text-center rounded-md font-body-sm text-body-sm font-semibold bg-error-container text-on-error-container shadow-sm transition-all">
                        Pengeluaran
                    </button>
<button aria-pressed="false" class="flex-1 py-2 text-center rounded-md font-body-sm text-body-sm font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all">
                        Pemasukan
                    </button>
</div>
<!-- Main Amount Input -->
<div class="mb-10 text-center">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase tracking-wider" for="amount">Jumlah</label>
<div class="flex items-center justify-center space-x-2">
<span class="font-display text-display text-on-surface opacity-50">Rp</span>
<input autofocus="" class="w-auto max-w-[250px] bg-transparent border-none text-center font-display text-display text-on-surface focus:ring-0 placeholder:text-surface-variant p-0 m-0 leading-none" id="amount" placeholder="0" type="text"/>
</div>
<div class="h-px w-32 bg-surface-variant mx-auto mt-4"></div>
</div>
<!-- Form Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-gutter gap-y-6">
<!-- Kategori -->
<div class="flex flex-col space-y-1">
<label class="font-body-sm text-body-sm text-on-surface-variant font-medium" for="category">Kategori</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="category">category</span>
</div>
<select class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest focus:ring-primary focus:border-primary font-body-lg text-body-lg text-on-surface appearance-none" id="category">
<option disabled="" selected="" value="">Pilih Kategori</option>
<option value="food">Makanan &amp; Minuman</option>
<option value="transport">Transportasi</option>
<option value="utilities">Tagihan</option>
<option value="charity">Infaq / Sedekah</option>
</select>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Tanggal & Waktu -->
<div class="flex flex-col space-y-1">
<label class="font-body-sm text-body-sm text-on-surface-variant font-medium" for="datetime">Tanggal &amp; Waktu</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="calendar_today">calendar_today</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest focus:ring-primary focus:border-primary font-body-lg text-body-lg text-on-surface" id="datetime" type="datetime-local"/>
</div>
</div>
<!-- Catatan / Deskripsi (Full Width) -->
<div class="flex flex-col space-y-1 md:col-span-2">
<label class="font-body-sm text-body-sm text-on-surface-variant font-medium" for="notes">Catatan (Opsional)</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 pt-3 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="notes">notes</span>
</div>
<textarea class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest focus:ring-primary focus:border-primary font-body-lg text-body-lg text-on-surface resize-none" id="notes" placeholder="Detail transaksi..." rows="2"></textarea>
</div>
</div>
<!-- Tipe Keperluan (Full Width) -->
<div class="flex flex-col space-y-2 md:col-span-2 mt-2">
<label class="font-body-sm text-body-sm text-on-surface-variant font-medium">Tipe Keperluan</label>
<div class="flex flex-wrap gap-3">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="need_type" type="radio" value="kebutuhan"/>
<div class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-body-sm text-body-sm peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-all flex items-center space-x-2">
<span class="material-symbols-outlined text-[16px]" data-icon="shopping_basket">shopping_basket</span>
<span>Kebutuhan Pokok</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="need_type" type="radio" value="keinginan"/>
<div class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-body-sm text-body-sm peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary-container transition-all flex items-center space-x-2">
<span class="material-symbols-outlined text-[16px]" data-icon="favorite">favorite</span>
<span>Keinginan</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="need_type" type="radio" value="infaq"/>
<div class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-body-sm text-body-sm peer-checked:bg-tertiary-container peer-checked:text-on-tertiary-container peer-checked:border-tertiary-container transition-all flex items-center space-x-2">
<span class="material-symbols-outlined text-[16px]" data-icon="volunteer_activism">volunteer_activism</span>
<span>Infaq/Kebaikan</span>
</div>
</label>
</div>
</div>
</div>
</div>
<!-- Modal Footer -->
<div class="px-lg py-md border-t border-surface-variant bg-surface-bright flex justify-end space-x-4">
<button class="px-6 py-2.5 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-lg text-body-lg font-medium hover:bg-surface-container-low transition-colors" type="button">
                    Batal
                </button>
<button class="px-6 py-2.5 rounded-lg bg-primary-container text-on-primary font-body-lg text-body-lg font-medium hover:bg-primary transition-colors shadow-sm flex items-center space-x-2" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="check">check</span>
<span>Simpan Transaksi</span>
</button>
</div>
</div>
</div>
<script>
        // Basic input formatting for the amount field to only allow numbers and format with thousand separators
        const amountInput = document.getElementById('amount');
        amountInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, ''); // Remove non-digits
            if (value !== '') {
                value = parseInt(value, 10).toLocaleString('id-ID'); // Format to Indonesian locale (dots for thousands)
            }
            e.target.value = value;
        });

        // Set default datetime to now
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('datetime').value = `${year}-${month}-${day}T${hours}:${minutes}`;
    </script>
</body></html>
