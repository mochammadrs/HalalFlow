<main class="w-full max-w-lg mx-auto">
<div class="bg-surface-container-lowest rounded-2xl p-2xl flex flex-col items-center justify-center text-center shadow-soft border border-surface-container-high relative overflow-hidden group hover:shadow-hover transition-shadow duration-300">

<span class="material-symbols-outlined text-[200px] text-primary">eco</span>
</div>
<!-- Illustration Area -->
<div class="relative w-48 h-48 mb-lg flex items-center justify-center">
<!-- Background decorative shapes -->
<div class="absolute inset-0 bg-surface-container-lowest rounded-full shadow-inner border border-surface-container-low"></div>
<div class="absolute inset-4 bg-surface-container-low rounded-full opacity-50"></div>
<!-- Main Icon/Illustration -->
<div class="relative z-10 flex flex-col items-center">
<span class="material-symbols-outlined text-[80px] text-primary-container font-light" style="font-variation-settings: 'FILL' 0, 'wght' 200;">receipt_long</span>
<span class="material-symbols-outlined text-3xl text-inverse-primary absolute -bottom-2 -right-4 bg-surface-container-lowest rounded-full p-1 shadow-sm" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
</div>

<h2 class="font-headline-md text-headline-md text-on-surface mb-sm z-10">Belum Ada Transaksi Bulan Ini</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-sm mb-xl z-10">

            </p>

<button class="z-10 bg-primary-container text-on-primary hover:bg-primary transition-colors duration-200 rounded-lg px-xl py-md font-label-caps text-label-caps flex items-center gap-xs shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2">

            </button>
</div>
